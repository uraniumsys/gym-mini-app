<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Motivation</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ============================================
           CSS ПЕРЕМЕННЫЕ ТЕМЫ (Новый дизайн)
           ============================================ */
        :root {
            /* Фоны */
            --bg-primary: #000000;
            --bg-secondary: #0F0F0F;
            --bg-tertiary: #1A1A1A;
            --bg-elevated: #222222;
            
            /* Границы (полупрозрачные, тонкие) */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.1);
            --border-strong: rgba(255, 255, 255, 0.15);
            
            /* Текст */
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1AA;
            --text-tertiary: #71717A;
            --text-disabled: #52525B;
            
            /* Акценты */
            --accent: #C6FF00;
            --accent-hover: #B8F100;
            --accent-glow: rgba(198, 255, 0, 0.15);
            --accent-gradient: linear-gradient(135deg, #C6FF00 0%, #00E676 100%);
            
            /* Статусы */
            --success: #00E676;
            --warning: #FFB300;
            --danger: #FF3D00;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            
            /* Радиусы */
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --radius-full: 999px;
            
            /* Тени */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 24px var(--accent-glow);
            
            /* Анимации */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Отступы */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
        }

        /* ============================================
           БАЗОВЫЕ СТИЛИ
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'cv11', 'ss01';
        }

        /* Скрываем стрелки у number input */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ============================================
           КОНТЕЙНЕР ЭКРАНОВ
           ============================================ */
        .view {
            display: none;
            min-height: 100vh;
            padding: var(--spacing-lg);
            padding-bottom: 120px;
            animation: viewEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .view.active {
            display: block;
        }

        @keyframes viewEnter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           ТИПОГРАФИКА (Крупная, выразительная)
           ============================================ */
        .display-large {
            font-size: 40px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: var(--spacing-md);
        }

        .display-medium {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: var(--spacing-sm);
        }

        h1, .h1 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.8px;
            margin-bottom: var(--spacing-sm);
        }

        h2, .h2 {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.4px;
            margin-bottom: var(--spacing-md);
        }

        h3, .h3 {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: var(--spacing-sm);
        }

        .body-large {
            font-size: 17px;
            font-weight: 400;
            line-height: 1.5;
        }

        .body-default {
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .body-small {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.4;
            color: var(--text-tertiary);
        }

        .caption {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .text-accent { color: var(--accent); }
        .text-secondary { color: var(--text-secondary); }
        .text-tertiary { color: var(--text-tertiary); }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }

        /* ============================================
           КАРТОЧКИ
           ============================================ */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            transition: var(--transition-base);
        }

        .card-interactive {
            cursor: pointer;
        }

        .card-interactive:active {
            transform: scale(0.98);
            background: var(--bg-tertiary);
        }

        .card-elevated {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
        }

        /* ============================================
           КНОПКИ
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: var(--radius-full);
            border: none;
            cursor: pointer;
            transition: var(--transition-fast);
            text-decoration: none;
            white-space: nowrap;
            min-height: 48px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent);
            color: #000000;
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-default);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
        }

        .btn-ghost {
            background: transparent;
            color: var(--accent);
            padding: 8px 16px;
            min-height: auto;
        }

        .btn-block {
            width: 100%;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: var(--radius-full);
        }

        /* ============================================
           ИНПУТЫ
           ============================================ */
        .input-group {
            margin-bottom: var(--spacing-md);
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            transition: var(--transition-fast);
        }

        .input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input::placeholder {
            color: var(--text-tertiary);
        }

        /* ============================================
           КАСТОМНЫЙ ЧЕКБОКС
           ============================================ */
        .checkbox {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .checkbox input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkbox-mark {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-strong);
            border-radius: var(--radius-xs);
            background: transparent;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox input:checked ~ .checkbox-mark {
            background: var(--accent);
            border-color: var(--accent);
        }

        .checkbox-mark svg {
            width: 14px;
            height: 14px;
            stroke: #000;
            stroke-width: 3;
            fill: none;
            opacity: 0;
            transform: scale(0.5);
            transition: var(--transition-fast);
        }

        .checkbox input:checked ~ .checkbox-mark svg {
            opacity: 1;
            transform: scale(1);
        }

        /* ============================================
           БЕЙДЖИ И ТЕГИ
           ============================================ */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: var(--radius-full);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .badge-accent {
            background: var(--accent-glow);
            color: var(--accent);
            border-color: transparent;
        }

        .badge-success {
            background: rgba(0, 230, 118, 0.15);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(255, 179, 0, 0.15);
            color: var(--warning);
        }

        .badge-danger {
            background: rgba(255, 61, 0, 0.15);
            color: var(--danger);
        }

        /* ============================================
           УТИЛИТЫ
           ============================================ */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-xs { gap: var(--spacing-xs); }
        .gap-sm { gap: var(--spacing-sm); }
        .gap-md { gap: var(--spacing-md); }
        .gap-lg { gap: var(--spacing-lg); }
        .mt-sm { margin-top: var(--spacing-sm); }
        .mt-md { margin-top: var(--spacing-md); }
        .mt-lg { margin-top: var(--spacing-lg); }
        .mt-xl { margin-top: var(--spacing-xl); }
        .mb-sm { margin-bottom: var(--spacing-sm); }
        .mb-md { margin-bottom: var(--spacing-md); }
        .mb-lg { margin-bottom: var(--spacing-lg); }
        .text-center { text-align: center; }
        .hidden { display: none !important; }

        /* ============================================
           ЗАГОЛОВОК ЭКРАНА С КНОПКОЙ НАЗАД
           ============================================ */
        .screen-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition-fast);
            flex-shrink: 0;
        }

        .back-btn:active {
            transform: scale(0.92);
            background: var(--bg-tertiary);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
        }

        /* ============================================
           КОЛЬЦО АКТИВНОСТИ (Apple Fitness стиль)
           ============================================ */
        .activity-ring-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
        }

        .activity-ring-container svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .activity-ring-bg {
            fill: none;
            stroke: var(--bg-tertiary);
            stroke-width: 14;
        }

        .activity-ring-progress {
            fill: none;
            stroke: url(#ringGradient);
            stroke-width: 14;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .activity-ring-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .activity-ring-value {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .activity-ring-label {
            font-size: 12px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* ============================================
           НИЖНЯЯ НАВИГАЦИЯ (Tab Bar)
           ============================================ */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            cursor: pointer;
            color: var(--text-tertiary);
            transition: var(--transition-fast);
        }

        .tab-item.active {
            color: var(--accent);
        }

        .tab-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .tab-item span {
            font-size: 11px;
            font-weight: 500;
        }
                /* ============================================
           МОДАЛЬНЫЕ ОКНА
           ============================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-base);
            padding: var(--spacing-lg);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            max-width: 400px;
            width: 100%;
            transform: scale(0.9) translateY(20px);
            transition: var(--transition-base);
            box-shadow: var(--shadow-lg);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            margin-bottom: var(--spacing-lg);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: var(--spacing-xs);
        }

        .modal-description {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .modal-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-xl);
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* ============================================
           ТАЙМЕР ОТДЫХА
           ============================================ */
        .rest-timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-xl);
            padding: var(--spacing-xl) 0;
        }

        .timer-circle {
            position: relative;
            width: 240px;
            height: 240px;
        }

        .timer-circle svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-circle-bg {
            fill: none;
            stroke: var(--bg-tertiary);
            stroke-width: 12;
        }

        .timer-circle-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .timer-circle-progress.warning {
            stroke: var(--warning);
            filter: drop-shadow(0 0 8px rgba(255, 179, 0, 0.3));
        }

        .timer-circle-progress.danger {
            stroke: var(--danger);
            filter: drop-shadow(0 0 8px rgba(255, 61, 0, 0.3));
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .timer-time {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .timer-label {
            font-size: 13px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: var(--spacing-xs);
        }

        .timer-controls {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }

        .timer-btn {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-full);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .timer-btn:active {
            transform: scale(0.92);
            background: var(--bg-elevated);
        }

        .timer-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
        }

        .timer-btn-primary {
            width: 72px;
            height: 72px;
            background: var(--accent);
            border: none;
        }

        .timer-btn-primary svg {
            stroke: #000;
            width: 32px;
            height: 32px;
        }

        /* ============================================
           КАРТОЧКИ УПРАЖНЕНИЙ
           ============================================ */
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .exercise-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            cursor: pointer;
            transition: var(--transition-base);
        }

        .exercise-card:active {
            transform: scale(0.98);
            background: var(--bg-tertiary);
        }

        .exercise-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
        }

        .exercise-card-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }

        .exercise-card-meta {
            display: flex;
            gap: var(--spacing-md);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .exercise-card-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .exercise-card-meta-item svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .exercise-progress-bar {
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-top: var(--spacing-md);
        }

        .exercise-progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: var(--radius-full);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================
           ДЕТАЛИ УПРАЖНЕНИЯ
           ============================================ */
        .exercise-detail-image {
            width: 100%;
            height: 200px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .exercise-detail-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .exercise-detail-image-placeholder {
            color: var(--text-tertiary);
            font-size: 14px;
        }

        .exercise-plan {
            display: flex;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .exercise-plan-item {
            flex: 1;
            text-align: center;
            padding: var(--spacing-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
        }

        .exercise-plan-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: var(--spacing-xs);
        }

        .exercise-plan-label {
            font-size: 12px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .exercise-tip {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-lg);
        }

        .exercise-tip-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .exercise-tip-title svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .exercise-tip-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* ============================================
           ПОДХОДЫ (Сеты)
           ============================================ */
        .sets-container {
            margin-top: var(--spacing-xl);
        }

        .set-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-sm);
            transition: var(--transition-base);
        }

        .set-item.completed {
            opacity: 0.6;
            background: var(--bg-tertiary);
        }

        .set-number {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .set-item.completed .set-number {
            background: var(--accent);
            color: #000;
        }

        .set-inputs {
            display: flex;
            gap: var(--spacing-sm);
            flex: 1;
        }

        .set-input {
            flex: 1;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            transition: var(--transition-fast);
        }

        .set-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-elevated);
        }

        .set-input::placeholder {
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .set-unit {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 2px;
            text-align: center;
        }

        /* ============================================
           ПРОГРЕСС-БАР ТРЕНИРОВКИ
           ============================================ */
        .workout-progress {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .workout-progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .workout-progress-title {
            font-size: 15px;
            font-weight: 600;
        }

        .workout-progress-count {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .workout-progress-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .workout-progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: var(--radius-full);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================
           ЭКРАН ЗАВЕРШЕНИЯ
           ============================================ */
        .completion-container {
            text-align: center;
            padding: var(--spacing-xl) 0;
        }

        .completion-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--spacing-xl);
            background: var(--accent-gradient);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-glow);
            animation: completionPulse 2s ease-in-out infinite;
        }

        @keyframes completionPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .completion-icon svg {
            width: 64px;
            height: 64px;
            stroke: #000;
            stroke-width: 2.5;
            fill: none;
        }

        .completion-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
            margin: var(--spacing-xl) 0;
        }

        .completion-stat {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
        }

        .completion-stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: var(--spacing-xs);
        }

        .completion-stat-label {
            font-size: 12px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================
           ПРОФИЛЬ
           ============================================ */
        .profile-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--spacing-md);
            background: var(--accent-gradient);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #000;
        }

        .profile-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .profile-stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
        }

        .profile-stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: var(--spacing-xs);
        }

        .profile-stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .profile-section {
            margin-bottom: var(--spacing-xl);
        }

        .profile-section-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        /* ============================================
           ГРАФИКИ
           ============================================ */
        .chart-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .chart-title {
            font-size: 15px;
            font-weight: 600;
        }

        .chart-svg {
            width: 100%;
            height: 120px;
        }

        /* ============================================
           ДОСТИЖЕНИЯ
           ============================================ */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
        }

        .achievement-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            text-align: center;
            transition: var(--transition-base);
        }

        .achievement-card.unlocked {
            border-color: var(--gold);
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.15);
        }

        .achievement-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--spacing-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .achievement-icon svg {
            width: 100%;
            height: 100%;
        }

        .achievement-card:not(.unlocked) .achievement-icon svg {
            stroke: var(--text-tertiary);
            fill: none;
        }

        .achievement-card.unlocked .achievement-icon svg {
            stroke: var(--gold);
            fill: var(--gold);
        }

        .achievement-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }

        .achievement-description {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        /* ============================================
           КОНСТРУКТОР ПРОГРАММ
           ============================================ */
        .builder-categories {
            display: flex;
            gap: var(--spacing-sm);
            overflow-x: auto;
            padding-bottom: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            scrollbar-width: none;
        }

        .builder-categories::-webkit-scrollbar {
            display: none;
        }

        .builder-category {
            padding: 10px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .builder-category.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .builder-exercise-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .builder-exercise-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-base);
        }

        .builder-exercise-item:active {
            transform: scale(0.98);
        }

        .builder-exercise-item.selected {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .builder-exercise-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .builder-exercise-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }

        .builder-exercise-info {
            flex: 1;
        }

        .builder-exercise-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .builder-exercise-muscle {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        /* ============================================
           УВЕДОМЛЕНИЯ (PR, ТОСТЫ)
           ============================================ */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .toast-icon svg {
            width: 100%;
            height: 100%;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .toast-message {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .pr-toast .toast-icon svg {
            stroke: var(--gold);
            fill: var(--gold);
        }

        /* ============================================
           ИНДИКАТОР ВОССТАНОВЛЕНИЯ МЫШЦ
           ============================================ */
        .muscle-recovery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
        }

        .muscle-recovery-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            text-align: center;
        }

        .muscle-recovery-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--spacing-sm);
            position: relative;
        }

        .muscle-recovery-icon svg {
            width: 100%;
            height: 100%;
            stroke: var(--text-secondary);
            stroke-width: 1.5;
            fill: none;
        }

        .muscle-recovery-status {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 16px;
            height: 16px;
            border-radius: var(--radius-full);
            border: 2px solid var(--bg-secondary);
        }

        .muscle-recovery-status.ready {
            background: var(--success);
        }

        .muscle-recovery-status.recovering {
            background: var(--warning);
        }

        .muscle-recovery-status.fatigued {
            background: var(--danger);
        }

        .muscle-recovery-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .muscle-recovery-days {
            font-size: 11px;
            color: var(--text-tertiary);
        }
        </head>
<body>
    <!-- ============================================
         ЭКРАН 1: ОНБОРДИНГ
         ============================================ -->
    <div id="view-onboarding" class="view active">
        <div class="text-center" style="padding: 40px 0;">
            <h1 class="display-large">Добро пожаловать</h1>
            <p class="body-default">Давай настроим приложение под тебя</p>
            
            <div class="card mt-xl" style="text-align: left;">
                <div class="input-group">
                    <label class="input-label">Возраст</label>
                    <input type="number" id="onboarding-age" class="input" placeholder="25" min="14" max="100">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Рост (см)</label>
                    <input type="number" id="onboarding-height" class="input" placeholder="175" min="100" max="250">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Вес (кг)</label>
                    <input type="number" id="onboarding-weight" class="input" placeholder="70" min="30" max="300">
                </div>
                
                <button class="btn btn-primary btn-block mt-lg" id="onboarding-save">
                    Начать тренировки
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================
         ЭКРАН 2: ГЛАВНЫЙ ЭКРАН
         ============================================ -->
    <div id="view-home" class="view">
        <div class="screen-header">
            <h1 class="h1">Gym Motivation</h1>
        </div>

        <!-- Кольцо активности -->
        <div class="card mb-lg">
            <div class="activity-ring-container">
                <svg viewBox="0 0 180 180">
                    <defs>
                        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#C6FF00"/>
                            <stop offset="100%" style="stop-color:#00E676"/>
                        </linearGradient>
                    </defs>
                    <circle class="activity-ring-bg" cx="90" cy="90" r="75"/>
                    <circle class="activity-ring-progress" cx="90" cy="90" r="75" 
                            stroke-dasharray="471" stroke-dashoffset="471"/>
                </svg>
                <div class="activity-ring-center">
                    <div class="activity-ring-value" id="activity-ring-value">0/3</div>
                    <div class="activity-ring-label">на этой неделе</div>
                </div>
            </div>
            <p class="text-center body-default mt-md" id="activity-message">
                Начни свою первую тренировку!
            </p>
        </div>

        <!-- Баннер продолжения тренировки -->
        <div id="continue-workout-banner" class="card card-interactive mb-lg hidden">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="h3">Продолжить тренировку</h3>
                    <p class="body-small" id="continue-workout-name">Full Body</p>
                </div>
                <div class="back-btn" style="background: var(--accent); border: none;">
                    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </div>
        </div>

        <!-- Программы тренировок -->
        <h2 class="h2">Программы</h2>
        <div class="exercise-list" id="programs-list">
            <!-- Заполняется JS -->
        </div>

        <button class="btn btn-secondary btn-block mt-lg" id="create-program-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Создать свою программу
        </button>
    </div>

    <!-- ============================================
         ЭКРАН 3: СПИСОК УПРАЖНЕНИЙ
         ============================================ -->
    <div id="view-exercises" class="view">
        <div class="screen-header">
            <button class="back-btn" onclick="navigateTo('view-home', 'back')">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="h1" id="exercises-title">Тренировка</h1>
        </div>

        <!-- Прогресс тренировки -->
        <div class="workout-progress">
            <div class="workout-progress-header">
                <span class="workout-progress-title">Прогресс</span>
                <span class="workout-progress-count" id="workout-progress-count">0/0</span>
            </div>
            <div class="workout-progress-bar">
                <div class="workout-progress-fill" id="workout-progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Список упражнений -->
        <div class="exercise-list" id="exercise-list">
            <!-- Заполняется JS -->
        </div>
    </div>

    <!-- ============================================
         ЭКРАН 4: ДЕТАЛИ УПРАЖНЕНИЯ
         ============================================ -->
    <div id="view-exercise-detail" class="view">
        <div class="screen-header">
            <button class="back-btn" onclick="navigateTo('view-exercises', 'back')">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="h1" id="exercise-detail-title">Упражнение</h1>
        </div>

        <!-- Изображение -->
        <div class="exercise-detail-image">
            <span class="exercise-detail-image-placeholder">Изображение упражнения</span>
        </div>

        <!-- План -->
        <div class="exercise-plan">
            <div class="exercise-plan-item">
                <div class="exercise-plan-value" id="exercise-sets">3</div>
                <div class="exercise-plan-label">Подходов</div>
            </div>
            <div class="exercise-plan-item">
                <div class="exercise-plan-value" id="exercise-reps">12</div>
                <div class="exercise-plan-label">Повторений</div>
            </div>
        </div>

        <!-- Подходы -->
        <div class="sets-container" id="sets-container">
            <!-- Заполняется JS -->
        </div>

        <!-- Совет по технике -->
        <div class="exercise-tip">
            <div class="exercise-tip-title">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Техника выполнения
            </div>
            <p class="exercise-tip-text" id="exercise-tip-text">
                Следите за техникой и контролируйте движение.
            </p>
        </div>

        <!-- Навигация -->
        <div class="flex gap-sm mt-xl">
            <button class="btn btn-secondary" id="prev-exercise-btn" style="flex: 1;">
                ← Назад
            </button>
            <button class="btn btn-primary" id="next-exercise-btn" style="flex: 1;">
                Далее →
            </button>
        </div>
    </div>

    <!-- ============================================
         ЭКРАН 5: ТАЙМЕР ОТДЫХА
         ============================================ -->
    <div id="view-rest" class="view">
        <div class="screen-header">
            <button class="back-btn" onclick="navigateTo('view-exercise-detail', 'back')">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="h1">Отдых</h1>
        </div>

        <div class="rest-timer-container">
            <div class="timer-circle">
                <svg viewBox="0 0 240 240">
                    <circle class="timer-circle-bg" cx="120" cy="120" r="100"/>
                    <circle class="timer-circle-progress" cx="120" cy="120" r="100" 
                            stroke-dasharray="628" stroke-dashoffset="0" id="timer-progress"/>
                </svg>
                <div class="timer-display">
                    <div class="timer-time" id="timer-time">1:00</div>
                    <div class="timer-label">секунд</div>
                </div>
            </div>

            <div class="timer-controls">
                <button class="timer-btn" id="timer-minus-10">
                    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
                </button>
                <button class="timer-btn timer-btn-primary" id="timer-toggle">
                    <svg viewBox="0 0 24 24" id="timer-toggle-icon">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                </button>
                <button class="timer-btn" id="timer-plus-10">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </div>

            <button class="btn btn-ghost" id="timer-skip">
                Пропустить отдых →
            </button>
        </div>
    </div>

    <!-- ============================================
         ЭКРАН 6: ЗАВЕРШЕНИЕ ТРЕНИРОВКИ
         ============================================ -->
    <div id="view-completion" class="view">
        <div class="completion-container">
            <div class="completion-icon">
                <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            
            <h1 class="display-large">Отличная работа!</h1>
            <p class="body-default">Тренировка завершена</p>

            <div class="completion-stats">
                <div class="completion-stat">
                    <div class="completion-stat-value" id="completion-time">0:00</div>
                    <div class="completion-stat-label">Время</div>
                </div>
                <div class="completion-stat">
                    <div class="completion-stat-value" id="completion-exercises">0</div>
                    <div class="completion-stat-label">Упражнений</div>
                </div>
                <div class="completion-stat">
                    <div class="completion-stat-value" id="completion-tonnage">0</div>
                    <div class="completion-stat-label">Тоннаж (кг)</div>
                </div>
            </div>

            <button class="btn btn-primary btn-block" id="share-workout-btn">
                Поделиться результатом
            </button>
            <button class="btn btn-secondary btn-block mt-sm" onclick="navigateTo('view-home', 'back')">
                На главную
            </button>
        </div>
    </div>
            <!-- ============================================
         ЭКРАН 7: ПРОФИЛЬ
         ============================================ -->
    <div id="view-profile" class="view">
        <div class="screen-header">

        ];

        // ============================================
        // СОСТОЯНИЕ ПРИЛОЖЕНИЯ
        // ============================================
        let state = {
            user: {
                age: null,
                height: null,
                weight: null
            },
            currentView: 'view-onboarding',
            currentProgram: null,
            currentExerciseIndex: 0,
            workoutInProgress: false,
            workoutData: {
                startTime: null,
                exercises: [],
                completedSets: []
            },
            history: [],
            customPrograms: [],
            restTime: 60,
            achievements: []
        };

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ LOCALSTORAGE
        // ============================================
        function loadState() {
            const saved = localStorage.getItem('gymMotivationState');
            if (saved) {
                state = { ...state, ...JSON.parse(saved) };
            }
        }

        function saveState() {
            localStorage.setItem('gymMotivationState', JSON.stringify(state));
        }

        // ============================================
        // НАВИГАЦИЯ
        // ============================================
        function navigateTo(viewId, direction = 'forward') {
    // 🛑 ИСПРАВЛЕНИЕ: Очищаем таймер, если уходим с экрана отдыха
    if (viewId !== 'view-rest' && timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerRunning = false;
    }

    // Скрываем все экраны
    document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
    });

    // Показываем нужный экран
    const targetView = document.getElementById(viewId);
    if (targetView) {
        targetView.classList.add('active');
        targetView.style.animation = direction === 'back' ? 'slideInLeft 0.3s ease-out' : 'viewEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
    }

    state.currentView = viewId;
    saveState();
    updateTabBar(viewId);

    if (tg) {
        if (viewId === 'view-home' || viewId === 'view-profile') {
            tg.BackButton.hide();
        } else {
            tg.BackButton.show();
        }
    }
}

        function updateTabBar(viewId) {
            document.querySelectorAll('.tab-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.view === viewId) {
                    item.classList.add('active');
                }
            });
        }

        // ============================================
        // МОДАЛЬНЫЕ ОКНА
        // ============================================
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('active');
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
            }
        }

        // ============================================
        // HAPTIC FEEDBACK
        // ============================================
        function hapticFeedback(type = 'light') {
            if (tg?.HapticFeedback) {
                if (type === 'light') {
                    tg.HapticFeedback.impactOccurred('light');
                } else if (type === 'medium') {
                    tg.HapticFeedback.impactOccurred('medium');
                } else if (type === 'heavy') {
                    tg.HapticFeedback.impactOccurred('heavy');
                } else if (type === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }

        // ============================================
        // TOAST УВЕДОМЛЕНИЯ
        // ============================================
        function showToast(title, message, type = 'default') {
            const toast = document.getElementById('toast-container');
            toast.innerHTML = `
                <div class="toast-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                </div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;
            toast.className = `toast show ${type}-toast`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // РЕНДЕРИНГ ПРОГРАММ
        // ============================================
        function renderPrograms() {
            const container = document.getElementById('programs-list');
            if (!container) return;

            const allPrograms = [...defaultPrograms, ...state.customPrograms];
            
            container.innerHTML = allPrograms.map(program => `
                <div class="exercise-card card-interactive" onclick="startWorkout('${program.id}')">
                    <div class="exercise-card-header">
                        <div>

                            <div class="exercise-card-meta">
