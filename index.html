<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gym***</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Конфигурация премиальной темы "Тихая роскошь"
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        bg: {
                            primary: '#09090B',
                            secondary: '#111114',
                            tertiary: '#18181B',
                        },
                        text: {
                            primary: '#F4F4F5',
                            secondary: '#A1A1AA',
                            muted: '#52525B',
                        },
                        accent: {
                            DEFAULT: '#C5A059', // Бронзовое золото
                            hover: '#D4AF37',
                            soft: 'rgba(197, 160, 89, 0.1)',
                        },
                        border: {
                            DEFAULT: 'rgba(255, 255, 255, 0.05)',
                            strong: 'rgba(255, 255, 255, 0.1)',
                        }
                    },
                    boxShadow: {
                        'premium': '0 4px 24px rgba(0, 0, 0, 0.4)',
                        'glow': '0 0 20px rgba(197, 160, 89, 0.15)',
                    }
                }
            }
        }
    </script>

    <!-- Подключаем премиальный шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Базовые премиальные стили */
        :root {
            color-scheme: dark;
        }
        body {
            margin: 0;
            background-color: #09090B;
            color: #F4F4F5;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            scrollbar-width: none; /* Скрываем скроллбар */
        }
        body::-webkit-scrollbar { display: none; }

        /* Анимации для плавных переходов (замена Framer Motion) */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            filter: blur(8px);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); /* Плавная кривая Безье */
        }
        .screen.active {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            pointer-events: auto;
            position: relative;
        }
        .screen.exit {
            opacity: 0;
            transform: translateY(-20px);
            filter: blur(8px);
        }

        /* Кастомные классы для карточек и кнопок */
        .glass-card {
            background: #111114;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            backdrop-filter: blur(4px);
        }
        .btn-primary {
            background: #C5A059;
            color: #09090B;
            font-weight: 600;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            width: 100%;
            text-align: center;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .input-premium {
            width: 100%;
            background: #18181B;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            padding: 0.875rem 1rem;
            color: #F4F4F5;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .input-premium:focus { border-color: rgba(197, 160, 89, 0.5); }
        .input-premium::placeholder { color: #52525B; }

        /* Анимация появления элементов списка */
        .stagger-item {
            opacity: 0;
            transform: translateX(-15px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .stagger-item.visible {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <main id="app" class="w-full min-h-screen relative">
        
        <!-- ЭКРАН 1: Приветствие и Имя -->
        <section id="screen-0" class="screen active">
            <div class="flex flex-col flex-1 justify-center">
                <div class="mb-10">
                    <h1 class="text-4xl font-bold tracking-tight mb-2">
                        gym<span class="text-accent">***</span>
                    </h1>
                    <p class="text-text-secondary text-lg leading-relaxed">
                        Пространство для тех, кто ценит<br>дисциплину и результат.
                    </p>
                </div>

                <div class="space-y-5">
                    <div>
                        <label class="block text-text-muted text-xs font-medium mb-2 uppercase tracking-widest">
                            Как к вам обращаться?
                        </label>
                        <input 
                            type="text" 
                            id="input-name" 
                            placeholder="Ваше имя" 
                            class="input-premium"
                            autocomplete="off"
                        >
                    </div>
                    
                    <button id="btn-next-0" class="btn-primary" disabled>
                        Продолжить
                    </button>
                </div>
            </div>
            
            <!-- Индикатор прогресса -->
            <div class="flex justify-center gap-2 mt-8 pb-4">
                <div class="h-1 w-8 rounded-full bg-accent transition-all duration-500" id="dot-0"></div>
                <div class="h-1 w-2 rounded-full bg-text-muted/30 transition-all duration-500" id="dot-1"></div>
            </div>
        </section>

        <!-- ЭКРАН 2: Выбор уровня -->
        <section id="screen-1" class="screen">
            <div class="flex flex-col flex-1">
                <div class="mb-6 mt-2">
                    <h2 class="text-2xl font-bold mb-1">Ваш уровень</h2>
                    <p class="text-text-secondary text-sm">
                        Подберем идеальную программу и интенсивность.
                    </p>
                </div>

                <div class="space-y-3 flex-1" id="levels-container">
                    <!-- Карточки уровней генерируются в JS -->
                </div>

                <button id="btn-finish" class="btn-primary mt-6" disabled>
                    Начать путь
                </button>
            </div>

            <div class="flex justify-center gap-2 mt-8 pb-4">
                <div class="h-1 w-2 rounded-full bg-text-muted/30 transition-all duration-500"></div>
                <div class="h-1 w-8 rounded-full bg-accent transition-all duration-500"></div>
            </div>
        </section>

    </main>

    <script>
        // ==========================================
        // 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP
        // ==========================================
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#09090B');
        tg.setBackgroundColor('#09090B');
        tg.MainButton.hide();
        tg.BackButton.hide();

        // ==========================================
        // 2. СОСТОЯНИЕ ПРИЛОЖЕНИЯ (Vanilla JS Store)
        // ==========================================
        const state = {
            currentStep: 0,
            name: '',
            level: null,
        };

        const levelsData = [
            { id: 'beginner', title: 'Новичок', desc: 'Только начинаете свой путь', icon: '🌱' },
            { id: 'enthusiast', title: 'Любитель', desc: 'Тренируетесь регулярно', icon: '🔥' },
            { id: 'pro', title: 'Профи', desc: 'Целенаправленный и жесткий тренинг', icon: '⚡️' }
        ];

        // ==========================================
        // 3. ЛОГИКА ПЕРЕХОДОВ И АНИМАЦИЙ
        // ==========================================
        function goToStep(stepIndex) {
            const currentScreen = document.getElementById(`screen-${state.currentStep}`);
            const nextScreen = document.getElementById(`screen-${stepIndex}`);

            // Анимация ухода текущего экрана
            currentScreen.classList.remove('active');
            currentScreen.classList.add('exit');

            // Через полсекунды показываем новый экран
            setTimeout(() => {
                currentScreen.classList.remove('exit');
                nextScreen.classList.add('active');
                state.currentStep = stepIndex;

                // Если перешли на шаг 2, анимируем появление карточек
                if (stepIndex === 1) {
                    animateLevelCards();
                }
            }, 300);
        }

        // ==========================================
        // 4. РЕНДЕРИНГ И ОБРАБОТКА СОБЫТИЙ
        // ==========================================
        
        // --- Шаг 0: Имя ---
        const inputName = document.getElementById('input-name');
        const btnNext0 = document.getElementById('btn-next-0');

        inputName.addEventListener('input', (e) => {
            state.name = e.target.value.trim();
            btnNext0.disabled = state.name.length === 0;
        });

        btnNext0.addEventListener('click', () => {
            if (state.name) goToStep(1);
        });

        // --- Шаг 1: Уровни ---
        const levelsContainer = document.getElementById('levels-container');
        const btnFinish = document.getElementById('btn-finish');

        // Генерируем карточки
        levelsData.forEach((lvl, index) => {
            const card = document.createElement('button');
            card.className = 'stagger-item w-full text-left p-4 rounded-2xl border transition-all duration-300 flex items-center gap-4 glass-card';
            card.dataset.level = lvl.id;
            card.innerHTML = `
                <span class="text-3xl">${lvl.icon}</span>
                <div class="flex-1">
                    <h3 class="font-semibold text-lg text-text-primary level-title">${lvl.title}</h3>
                    <p class="text-text-secondary text-sm mt-0.5">${lvl.desc}</p>
                </div>
                <div class="check-icon w-6 h-6 rounded-full bg-accent flex items-center justify-center opacity-0 scale-0 transition-all duration-300">
                    <svg class="w-4 h-4 text-bg-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            `;
            
            card.addEventListener('click', () => selectLevel(lvl.id));
            levelsContainer.appendChild(card);
        });

        function selectLevel(levelId) {
            state.level = levelId;
            btnFinish.disabled = false;

            // Обновляем UI карточек
            document.querySelectorAll('#levels-container button').forEach(card => {
                const isSelected = card.dataset.level === levelId;
                const title = card.querySelector('.level-title');
                const check = card.querySelector('.check-icon');

                if (isSelected) {
                    card.classList.add('border-accent/40', 'shadow-glow');
                    card.style.background = 'rgba(197, 160, 89, 0.05)';
                    title.classList.add('text-accent');
                    title.classList.remove('text-text-primary');
                    check.style.opacity = '1';
                    check.style.transform = 'scale(1)';
                } else {
                    card.classList.remove('border-accent/40', 'shadow-glow');
                    card.style.background = '';
                    title.classList.remove('text-accent');
                    title.classList.add('text-text-primary');
                    check.style.opacity = '0';
                    check.style.transform = 'scale(0)';
                }
            });
        }

        function animateLevelCards() {
            const items = document.querySelectorAll('.stagger-item');
            items.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('visible');
                }, index * 100 + 200); // Задержка для эффекта "каскада"
            });
        }

        btnFinish.addEventListener('click', () => {
            if (state.level) {
                // Здесь будет переход на Главный экран (Home)
                // Пока просто выведем данные в консоль и покажем алерт
                console.log('User registered:', state);
                alert(`Добро пожаловать, ${state.name}! Уровень: ${state.level}.\n\nДалее будет Главный экран с кольцами активности.`);
                
                // Сброс для демо
                // goToStep(0); 
            }
        });

    </script>
</body>
</html>
