                                    ${program.exercises.length} упражнений
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
        // ============================================
        
            // ============================================
        // РЕНДЕРИНГ КОЛЬЦА АКТИВНОСТИ
        // ============================================
        function renderActivityRing() {
            const weekWorkouts = getWeekWorkoutsCount();
            const goal = 3;
            const progress = Math.min(weekWorkouts / goal, 1);
            
            const ring = document.querySelector('.activity-ring-progress');
            const valueEl = document.getElementById('activity-ring-value');
            const messageEl = document.getElementById('activity-message');
            
            if (ring && valueEl && messageEl) {
                // Длина окружности: 2 * π * 75 ≈ 471
                const circumference = 471;
                const offset = circumference - (progress * circumference);
                ring.style.strokeDashoffset = offset;
                
                valueEl.textContent = `${weekWorkouts}/${goal}`;
                
                if (weekWorkouts === 0) {
                    messageEl.textContent = 'Начни свою первую тренировку на этой неделе!';
                } else if (weekWorkouts < goal) {
                    messageEl.textContent = `Осталось ${goal - weekWorkouts} тренировок до цели!`;
                } else {
                    messageEl.textContent = '🔥 Цель недели достигнута! Так держать!';
                }
            }
        }

        function getWeekWorkoutsCount() {
            const now = new Date();
            const startOfWeek = new Date(now);
            const day = startOfWeek.getDay();
            const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
            startOfWeek.setDate(diff);
            startOfWeek.setHours(0, 0, 0, 0);
            
            return state.history.filter(workout => {
                const workoutDate = new Date(workout.date);
                return workoutDate >= startOfWeek;
            }).length;
        }

        // ============================================
        // ОНБОРДИНГ
        // ============================================
        function handleOnboardingSave() {
            const age = parseInt(document.getElementById('onboarding-age').value);
            const height = parseInt(document.getElementById('onboarding-height').value);
            const weight = parseInt(document.getElementById('onboarding-weight').value);
            
            if (!age || !height || !weight) {
                showToast('Заполни все поля', 'Возраст, рост и вес обязательны', 'default');
                return;
            }
            
            state.user = { age, height, weight };
            saveState();
            hapticFeedback('success');
            navigateTo('view-home');
            renderPrograms();
            renderActivityRing();
        }

        // ============================================
        // НАЧАЛО ТРЕНИРОВКИ
        // ============================================
        function startWorkout(programId) {
            const allPrograms = [...defaultPrograms, ...state.customPrograms];
            const program = allPrograms.find(p => p.id === programId);
            
            if (!program) return;
            
            state.currentProgram = program;
            state.currentExerciseIndex = 0;
            state.workoutInProgress = true;
            state.workoutData = {
                startTime: new Date(),
                programName: program.name,
                exercises: program.exercises.map(exId => {
                    const exercise = exercises.find(e => e.id === exId);
                    return {
                        ...exercise,
                        sets: Array.from({ length: exercise.sets }, (_, i) => ({
                            setNumber: i + 1,
                            weight: '',
                            reps: '',
                            completed: false
                        }))
                    };
                }),
                completedSets: []
            };
            
            saveState();
            hapticFeedback('medium');
            navigateTo('view-exercises');
            renderExercisesList();
        }

        // ============================================
        // РЕНДЕРИНГ СПИСКА УПРАЖНЕНИЙ
        // ============================================
        function renderExercisesList() {
            const container = document.getElementById('exercise-list');
            const title = document.getElementById('exercises-title');
            
            if (!container || !state.workoutData) return;
            
            title.textContent = state.workoutData.programName;
            
            container.innerHTML = state.workoutData.exercises.map((exercise, index) => {
                const completedSets = exercise.sets.filter(s => s.completed).length;
                const totalSets = exercise.sets.length;
                const progress = (completedSets / totalSets) * 100;
                
                return `
                    <div class="exercise-card card-interactive" onclick="openExerciseDetail(${index})">
                        <div class="exercise-card-header">
                            <div>
                                <div class="exercise-card-title">${exercise.name}</div>
                                <div class="exercise-card-meta">
                                    <div class="exercise-card-meta-item">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"/>
                                            <polyline points="12 6 12 12 16 14"/>
                                        </svg>
                                        ${exercise.sets.length} × ${exercise.reps}
                                    </div>
                                    <div class="exercise-card-meta-item">
                                        ${completedSets}/${totalSets} подходов
                                    </div>
                                </div>
                            </div>
                            <div class="badge ${completedSets === totalSets ? 'badge-success' : 'badge-accent'}">
                                ${completedSets === totalSets ? '✓' : Math.round(progress) + '%'}
                            </div>
                        </div>
                        <div class="exercise-progress-bar">
                            <div class="exercise-progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
            
            updateWorkoutProgress();
        }

        function updateWorkoutProgress() {
            if (!state.workoutData) return;
            
            const totalSets = state.workoutData.exercises.reduce((sum, ex) => sum + ex.sets.length, 0);
            const completedSets = state.workoutData.exercises.reduce(
                (sum, ex) => sum + ex.sets.filter(s => s.completed).length, 0
            );
            
            const countEl = document.getElementById('workout-progress-count');
            const fillEl = document.getElementById('workout-progress-fill');
            
            if (countEl) countEl.textContent = `${completedSets}/${totalSets}`;
            if (fillEl) fillEl.style.width = `${(completedSets / totalSets) * 100}%`;
            
            // Если все подходы завершены — показываем экран завершения
            if (completedSets === totalSets && totalSets > 0) {
                setTimeout(() => completeWorkout(), 500);
            }
        }

        // ============================================
        // ДЕТАЛИ УПРАЖНЕНИЯ
        // ============================================
        function openExerciseDetail(index) {
            state.currentExerciseIndex = index;
            saveState();
            
            const exercise = state.workoutData.exercises[index];
            if (!exercise) return;
            
            document.getElementById('exercise-detail-title').textContent = exercise.name;
            document.getElementById('exercise-sets').textContent = exercise.sets.length;
            document.getElementById('exercise-reps').textContent = exercise.reps;
            document.getElementById('exercise-tip-text').textContent = exercise.tip;
            
            renderSets();
            updateExerciseNavigation();
            
            navigateTo('view-exercise-detail');
        }

        function renderSets() {
            const container = document.getElementById('sets-container');
            const exercise = state.workoutData.exercises[state.currentExerciseIndex];
            
            if (!container || !exercise) return;
            
            container.innerHTML = exercise.sets.map((set, index) => `
                <div class="set-item ${set.completed ? 'completed' : ''}" data-set-index="${index}">
                    <label class="checkbox">
                        <input type="checkbox" ${set.completed ? 'checked' : ''} 
                               onchange="toggleSet(${index})">
                        <span class="checkbox-mark">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </span>
                    </label>
                    <div class="set-number">${set.setNumber}</div>
                    <div class="set-inputs">
                        <div style="flex: 1;">
                            <input type="number" class="set-input" placeholder="0" 
                                   value="${set.weight}" 
                                   onchange="updateSet(${index}, 'weight', this.value)">
                            <div class="set-unit">кг</div>
                        </div>
                        <div style="flex: 1;">
                            <input type="number" class="set-input" placeholder="0" 
                                   value="${set.reps}" 
                                   onchange="updateSet(${index}, 'reps', this.value)">
                            <div class="set-unit">повт</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateSet(setIndex, field, value) {
            const exercise = state.workoutData.exercises[state.currentExerciseIndex];
            exercise.sets[setIndex][field] = value;
            saveState();
        }

        function toggleSet(setIndex) {
    const exercise = state.workoutData.exercises[state.currentExerciseIndex];
    const set = exercise.sets[setIndex];

    const weight = parseFloat(set.weight) || 0;
    const reps = parseFloat(set.reps) || 0;

    if (!set.completed && weight > 0 && reps > 0) {
        checkPersonalRecord(exercise.id, weight, reps);
    }

    set.completed = !set.completed;

    if (set.completed) {
        // ✅ ИСПРАВЛЕНИЕ: Сохраняем время завершения
        set.completedAt = new Date().getTime(); 
        
        state.workoutData.completedSets.push({
            exerciseId: exercise.id,
            exerciseName: exercise.name,
            weight: weight,
            reps: reps,
            timestamp: new Date()
        });
        hapticFeedback('success');
        startRestTimer();
    } else {
        // Теперь фильтр сможет найти этот сет по completedAt
        state.workoutData.completedSets = state.workoutData.completedSets.filter(
            s => !(s.exerciseId === exercise.id && s.timestamp.getTime() === set.completedAt)
        );
    }
    
    saveState();
    renderSets();
    renderExercisesList();
}
            
            saveState();
            renderSets();
            renderExercisesList();
        }

        // ============================================
        // ПРОВЕРКА ЛИЧНЫХ РЕКОРДОВ (PR)
        // ============================================
        function checkPersonalRecord(exerciseId, weight, reps) {
            const history = state.history || [];
            let maxWeight = 0;
            
            // Ищем прошлые результаты этого упражнения
            history.forEach(workout => {
                workout.exercises?.forEach(ex => {
                    if (ex.id === exerciseId) {
                        ex.sets?.forEach(set => {
                            if (set.completed && parseFloat(set.weight) > maxWeight) {
                                maxWeight = parseFloat(set.weight);
                            }
                        });
                    }
                });
            });
            
            // Также проверяем текущую тренировку
            state.workoutData.exercises.forEach(ex => {
                if (ex.id === exerciseId) {
                    ex.sets.forEach(set => {
                        if (set.completed && parseFloat(set.weight) > maxWeight) {
                            maxWeight = parseFloat(set.weight);
                        }
                    });
                }
            });
            
            // Если это первое выполнение — просто уведомляем
if (maxWeight === 0) {
    showToast('🎯 Первое выполнение!', `${weight} кг`, 'pr');
    hapticFeedback('medium');
} 
// Если вес больше прошлого максимума — новый рекорд!
else if (weight > maxWeight) {
    showToast('🏆 Новый рекорд!', `${weight} кг (было ${maxWeight} кг)`, 'pr');
    hapticFeedback('heavy');
}
        }

        // ============================================
        // НАВИГАЦИЯ МЕЖДУ УПРАЖНЕНИЯМИ
        // ============================================
        function updateExerciseNavigation() {
            const prevBtn = document.getElementById('prev-exercise-btn');
            const nextBtn = document.getElementById('next-exercise-btn');
            
            if (prevBtn) {
                prevBtn.style.visibility = state.currentExerciseIndex === 0 ? 'hidden' : 'visible';
            }
            
            if (nextBtn) {
                const isLast = state.currentExerciseIndex === state.workoutData.exercises.length - 1;
                nextBtn.textContent = isLast ? 'Завершить ✓' : 'Далее →';
            }
        }

        function nextExercise() {
            if (state.currentExerciseIndex < state.workoutData.exercises.length - 1) {
                state.currentExerciseIndex++;
                saveState();
                openExerciseDetail(state.currentExerciseIndex);
            } else {
                completeWorkout();
            }
        }

        function prevExercise() {
            if (state.currentExerciseIndex > 0) {
                state.currentExerciseIndex--;
                saveState();
                openExerciseDetail(state.currentExerciseIndex);
            }
        }

        // ============================================
        // ТАЙМЕР ОТДЫХА
        // ============================================
        let timerInterval = null;
        let timerSeconds = 0;
        let timerRunning = false;

        function startRestTimer() {
            timerSeconds = state.restTime;
            timerRunning = true;
            navigateTo('view-rest');
            updateTimerDisplay();
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!timerRunning) return;
                
                timerSeconds--;
                updateTimerDisplay();
                
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    hapticFeedback('heavy');
                    
                    // Звуковой сигнал (если поддерживается)
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = 800;
                        gain.gain.value = 0.3;
                        osc.start();
                        setTimeout(() => { osc.stop(); ctx.close(); }, 300);
                    } catch (e) {}
                    
                    setTimeout(() => {
                        navigateTo('view-exercise-detail', 'back');
                    }, 1000);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timeEl = document.getElementById('timer-time');
            const progressEl = document.getElementById('timer-progress');
            
            if (timeEl) {
                const mins = Math.floor(timerSeconds / 60);
                const secs = timerSeconds % 60;
                timeEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
            
            if (progressEl) {
                const circumference = 628; // 2 * π * 100
                const progress = timerSeconds / state.restTime;
                progressEl.style.strokeDashoffset = circumference * (1 - progress);
                
                // Цветовая индикация
                progressEl.classList.remove('warning', 'danger');
                if (timerSeconds <= 10) {
                    progressEl.classList.add('danger');
                } else if (timerSeconds <= 20) {
                    progressEl.classList.add('warning');
                }
            }
        }

        function toggleTimer() {
            timerRunning = !timerRunning;
            const icon = document.getElementById('timer-toggle-icon');
            if (icon) {
                if (timerRunning) {
                    icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
                } else {
                    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
                }
            }
        }

        function adjustTimer(seconds) {
            timerSeconds = Math.max(0, timerSeconds + seconds);
            updateTimerDisplay();
            hapticFeedback('light');
        }

        function skipRest() {
            if (timerInterval) clearInterval(timerInterval);
            timerRunning = false;
            navigateTo('view-exercise-detail', 'back');
        }

        // ============================================
        // ЗАВЕРШЕНИЕ ТРЕНИРОВКИ
        // ============================================
        function completeWorkout() {
            if (!state.workoutData) return;
            
            const endTime = new Date();
            const duration = Math.round((endTime - new Date(state.workoutData.startTime)) / 1000 / 60);
            
            // Подсчет тоннажа
            let tonnage = 0;
            state.workoutData.exercises.forEach(ex => {
                ex.sets.forEach(set => {
                    if (set.completed) {
                        tonnage += (parseFloat(set.weight) || 0) * (parseFloat(set.reps) || 0);
                    }
                });
            });
            
            const completedExercises = state.workoutData.exercises.filter(ex => 
                ex.sets.every(s => s.completed)
            ).length;
            
            // Сохраняем в историю
            // Найди в completeWorkout блок const workoutRecord = { ... } и замени на:
const workoutRecord = {
    date: new Date().toISOString(),
    programName: state.workoutData.programName,
    duration: duration,
    weight: state.user.weight, // ✅ ДОБАВЛЕНО: Снимок веса на момент тренировки
    exercises: state.workoutData.exercises.map(ex => ({
        id: ex.id,
        name: ex.name,
        category: ex.category,
        sets: ex.sets
    })),
    tonnage: tonnage,
    completedExercises: completedExercises
};
            
            state.history.push(workoutRecord);
            state.workoutInProgress = false;
            state.workoutData = null;
            
            // Обновляем максимальный тоннаж для достижений
            if (!state.maxTonnage || tonnage > state.maxTonnage) {
                state.maxTonnage = tonnage;
            }
            
            saveState();
            hapticFeedback('success');
            
            // Показываем экран завершения
            document.getElementById('completion-time').textContent = 
                `${Math.floor(duration / 60)}:${(duration % 60).toString().padStart(2, '0')}`;
            document.getElementById('completion-exercises').textContent = completedExercises;
            document.getElementById('completion-tonnage').textContent = Math.round(tonnage);
            
            navigateTo('view-completion');
            checkAchievements();
        }

        // ============================================
        // ДОСТИЖЕНИЯ
        // ============================================
        function checkAchievements() {
            const stats = {
                totalWorkouts: state.history.length,
                weekWorkouts: getWeekWorkoutsCount(),
                maxTonnage: state.maxTonnage || 0
            };
            
            achievements.forEach(ach => {
                if (!state.achievements.includes(ach.id) && ach.condition(stats)) {
                    state.achievements.push(ach.id);
                    showToast('🏆 Достижение!', ach.title, 'pr');
                    hapticFeedback('heavy');
                }
            });
            
            saveState();
        }

        function renderAchievements() {
            const container = document.getElementById('achievements-grid');
            if (!container) return;
            
            container.innerHTML = achievements.map(ach => {
                const unlocked = state.achievements.includes(ach.id);
                return `
                    <div class="achievement-card ${unlocked ? 'unlocked' : ''}">
                        <div class="achievement-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                ${getAchievementIcon(ach.icon)}
                            </svg>
                        </div>
                        <div class="achievement-title">${ach.title}</div>
                        <div class="achievement-description">${ach.description}</div>
                    </div>
                `;
            }).join('');
        }

        function getAchievementIcon(type) {
            const icons = {
                trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66v1.7c0 1-.6 1.64-1.4 1.64H7.4c-.8 0-1.4-.64-1.4-1.64v-1.7"/><path d="M14 14.66v1.7c0 1 .6 1.64 1.4 1.64h1.2c.8 0 1.4-.64 1.4-1.64v-1.7"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
                fire: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
                weight: '<path d="M6 18V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13"/><path d="M4 18h16"/><path d="M2 22h20"/>',
                calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
                muscle: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V8s-1 1-4 1-5-2-8-2-4 1-4 1z"/><circle cx="12" cy="12" r="3"/>',
                crown: '<path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"/><path d="M5 20h14"/>'
            };
            return icons[type] || icons.trophy;
        }

        // ============================================
        // ПРОФИЛЬ
        // ============================================
        function renderProfile() {
            if (!state.user.age) return;
            
            // Аватар
            const avatar = document.getElementById('profile-avatar');
            if (avatar) {
                avatar.textContent = 'У';
            }
            
            // Статистика
            const statsText = document.getElementById('profile-stats-text');
            if (statsText) {
                statsText.textContent = `Возраст: ${state.user.age} | Рост: ${state.user.height} | Вес: ${state.user.weight}`;
            }
            
            document.getElementById('profile-workouts-week').textContent = getWeekWorkoutsCount();
            document.getElementById('profile-workouts-total').textContent = state.history.length;
            
            renderWeightChart();
            renderMuscleRecovery();
            renderAchievements();
            renderDailyTip();
        }

        function renderWeightChart() {
    const svg = document.getElementById('weight-chart');
    if (!svg) return;

    // ✅ ИСПРАВЛЕНИЕ: Берем вес из истории (снимок), а не текущий
    const weightData = state.history
        .filter(w => w.weight) // Фильтруем старые записи, где еще не было поля weight
        .map(w => ({
            date: new Date(w.date),
            weight: w.weight 
        }));

    if (weightData.length < 2) {
        svg.innerHTML = '<text x="150" y="60" text-anchor="middle" fill="#71717A" font-size="12">Нужно минимум 2 тренировки</text>';
        return;
    }

    const weights = weightData.map(d => d.weight);
    const minW = Math.min(...weights) - 2;
    const maxW = Math.max(...weights) + 2;
    const range = maxW - minW || 1;
    const width = 300;
    const height = 120;
    const padding = 20;

    const points = weightData.map((d, i) => {
        const x = padding + (i / (weightData.length - 1)) * (width - 2 * padding);
        const y = height - padding - ((d.weight - minW) / range) * (height - 2 * padding);
        return `${x},${y}`;
    }).join(' ');

    svg.innerHTML = `
        <polyline points="${points}" fill="none" stroke="#C6FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${weightData.map((d, i) => {
            const x = padding + (i / (weightData.length - 1)) * (width - 2 * padding);
            const y = height - padding - ((d.weight - minW) / range) * (height - 2 * padding);
            return `<circle cx="${x}" cy="${y}" r="3" fill="#C6FF00"/>`;
        }).join('')}
    `;
}

        function renderMuscleRecovery() {
            const container = document.getElementById('muscle-recovery-grid');
            if (!container) return;
            
            const muscleGroups = [
                { id: 'legs', name: 'Ноги', icon: 'legs' },
                { id: 'chest', name: 'Грудь', icon: 'chest' },
                { id: 'back', name: 'Спина', icon: 'back' },
                { id: 'shoulders', name: 'Плечи', icon: 'shoulders' },
                { id: 'arms', name: 'Руки', icon: 'arms' },
                { id: 'core', name: 'Кор', icon: 'core' }
            ];
            
            container.innerHTML = muscleGroups.map(group => {
                const lastTrained = getLastTrainingDateForGroup(group.id);
                const daysAgo = lastTrained ? Math.floor((new Date() - lastTrained) / (1000 * 60 * 60 * 24)) : 999;
                
                let status, statusText;
                if (daysAgo >= 4) {
                    status = 'ready';
                    statusText = 'Готово';
                } else if (daysAgo >= 2) {
                    status = 'recovering';
                    statusText = `${daysAgo} дн назад`;
                } else {
                    status = 'fatigued';
                    statusText = 'Восстановление';
                }
                
                return `
                    <div class="muscle-recovery-item">
                        <div class="muscle-recovery-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                ${getMuscleIcon(group.icon)}
                            </svg>
                            <div class="muscle-recovery-status ${status}"></div>
                        </div>
                        <div class="muscle-recovery-name">${group.name}</div>
                        <div class="muscle-recovery-days">${statusText}</div>
                    </div>
                `;
            }).join('');
        }

        function getMuscleIcon(type) {
            const icons = {
                legs: '<path d="M6 11V8a6 6 0 0 1 12 0v3"/><path d="M6 11l-2 9h4l2-5"/><path d="M18 11l2 9h-4l-2-5"/>',
                chest: '<path d="M6 7c0-2 2-3 6-3s6 1 6 3v10c0 2-2 3-6 3s-6-1-6-3V7z"/><path d="M12 4v16"/>',
                back: '<path d="M8 4c-2 0-3 2-3 4v8c0 2 1 4 3 4"/><path d="M16 4c2 0 3 2 3 4v8c0 2-1 4-3 4"/><path d="M8 4h8"/><path d="M8 20h8"/>',
                shoulders: '<circle cx="12" cy="6" r="3"/><path d="M6 11c-2 0-3 2-3 4v5h18v-5c0-2-1-4-3-4"/>',
                arms: '<path d="M6 6l6 6 6-6"/><path d="M12 12v8"/><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>',
                core: '<rect x="7" y="4" width="10" height="16" rx="2"/><path d="M7 10h10"/><path d="M7 14h10"/>'
            };
            return icons[type] || icons.core;
        }

        function getLastTrainingDateForGroup(groupId) {
            let lastDate = null;
            state.history.forEach(workout => {
                workout.exercises?.forEach(ex => {
                    if (ex.category === groupId) {
                        const workoutDate = new Date(workout.date);
                        if (!lastDate || workoutDate > lastDate) {
                            lastDate = workoutDate;
                        }
                    }
                });
            });
            return lastDate;
        }

        function renderDailyTip() {
            const tipEl = document.getElementById('daily-tip-text');
            if (tipEl) {
                const todayIndex = new Date().getDate() % tips.length;
                tipEl.textContent = tips[todayIndex];
            }
        }

        // ============================================
        // КОНСТРУКТОР ПРОГРАММ
        // ============================================
        let builderSelected = [];
        let builderCategory = 'all';

        function renderBuilder() {
            renderBuilderCategories();
            renderBuilderExercises();
        }

        function renderBuilderCategories() {
            document.querySelectorAll('.builder-category').forEach(cat => {
                cat.classList.toggle('active', cat.dataset.category === builderCategory);
            });
        }

        function renderBuilderExercises() {
            const container = document.getElementById('builder-exercise-list');
            if (!container) return;
            
            const filtered = builderCategory === 'all' 
                ? exercises 
                : exercises.filter(e => e.category === builderCategory);
            
            container.innerHTML = filtered.map(ex => `
                <div class="builder-exercise-item ${builderSelected.includes(ex.id) ? 'selected' : ''}" 
                     onclick="toggleBuilderExercise('${ex.id}')">
                    <div class="builder-exercise-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            ${getMuscleIcon(ex.icon)}
                        </svg>
                    </div>
                    <div class="builder-exercise-info">
                        <div class="builder-exercise-name">${ex.name}</div>
                        <div class="builder-exercise-muscle">${ex.muscle}</div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('builder-selected-count').textContent = builderSelected.length;
        }

        function toggleBuilderExercise(exerciseId) {
            if (builderSelected.includes(exerciseId)) {
                builderSelected = builderSelected.filter(id => id !== exerciseId);
            } else {
                builderSelected.push(exerciseId);
            }
            hapticFeedback('light');
            renderBuilderExercises();
        }

        function saveBuilderProgram() {
            const name = document.getElementById('builder-program-name').value.trim();
            
            if (!name) {
                showToast('Введите название', 'Укажи имя для программы', 'default');
                return;
            }
            
            if (builderSelected.length === 0) {
                showToast('Выбери упражнения', 'Добавь хотя бы одно упражнение', 'default');
                return;
            }
            
            const newProgram = {
                id: 'custom_' + Date.now(),
                name: name,
                description: `Пользовательская программа`,
                exercises: [...builderSelected]
            };
            
            state.customPrograms.push(newProgram);
            saveState();
            hapticFeedback('success');
            
            builderSelected = [];
            document.getElementById('builder-program-name').value = '';
            
            navigateTo('view-home');
            renderPrograms();
        }

        // ============================================
        // ЭКСПОРТ / ИМПОРТ / СБРОС
        // ============================================
        function exportData() {
            const data = JSON.stringify(state, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gym-motivation-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            hapticFeedback('success');
            showToast('Экспортировано', 'Файл сохранен', 'default');
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    state = { ...state, ...imported };
                    saveState();
                    hapticFeedback('success');
                    showToast('Импортировано', 'Данные восстановлены', 'default');
                    init();
                } catch (err) {
                    showToast('Ошибка', 'Неверный формат файла', 'default');
                }
            };
            reader.readAsText(file);
        }

        function resetProgress() {
            localStorage.removeItem('gymMotivationState');
            state = {
                user: { age: null, height: null, weight: null },
                currentView: 'view-onboarding',
                currentProgram: null,
                currentExerciseIndex: 0,
                workoutInProgress: false,
                workoutData: null,
                history: [],
                customPrograms: [],
                restTime: 60,
                achievements: []
            };
            hapticFeedback('heavy');
            closeModal('modal-confirm-reset');
            navigateTo('view-onboarding');
        }

        // ============================================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================
        function setupEventListeners() {
            // Онбординг
            document.getElementById('onboarding-save')?.addEventListener('click', handleOnboardingSave);
            
            // Создание программы
            document.getElementById('create-program-btn')?.addEventListener('click', () => {
                navigateTo('view-builder');
                renderBuilder();
            });
            
            // Навигация по упражнениям
            document.getElementById('next-exercise-btn')?.addEventListener('click', nextExercise);
            document.getElementById('prev-exercise-btn')?.addEventListener('click', prevExercise);
            
            // Таймер
            document.getElementById('timer-toggle')?.addEventListener('click', toggleTimer);
            document.getElementById('timer-minus-10')?.addEventListener('click', () => adjustTimer(-10));
            document.getElementById('timer-plus-10')?.addEventListener('click', () => adjustTimer(10));
            document.getElementById('timer-skip')?.addEventListener('click', skipRest);
            
            // Профиль
            document.getElementById('edit-profile-btn')?.addEventListener('click', () => {
                document.getElementById('edit-age').value = state.user.age;
                document.getElementById('edit-height').value = state.user.height;
                document.getElementById('edit-weight').value = state.user.weight;
                openModal('modal-edit-profile');
            });
            
            document.getElementById('save-profile-btn')?.addEventListener('click', () => {
                state.user.age = parseInt(document.getElementById('edit-age').value);
                state.user.height = parseInt(document.getElementById('edit-height').value);
                state.user.weight = parseInt(document.getElementById('edit-weight').value);
                saveState();
                closeModal('modal-edit-profile');
                renderProfile();
                hapticFeedback('success');
            });
            
            document.getElementById('export-data-btn')?.addEventListener('click', exportData);
            
            document.getElementById('import-data-btn')?.addEventListener('click', () => {
                document.getElementById('import-file-input').click();
            });
            
            document.getElementById('import-file-input')?.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    importData(e.target.files[0]);
                }
            });
            
            document.getElementById('reset-progress-btn')?.addEventListener('click', () => {
                openModal('modal-confirm-reset');
            });
            
            document.getElementById('confirm-reset-btn')?.addEventListener('click', resetProgress);
            
            // Конструктор
            document.querySelectorAll('.builder-category').forEach(cat => {
                cat.addEventListener('click', () => {
                    builderCategory = cat.dataset.category;
                    renderBuilderCategories();
                    renderBuilderExercises();
                });
            });
            
            document.getElementById('builder-save-btn')?.addEventListener('click', saveBuilderProgram);
            
            // Tab Bar
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.addEventListener('click', () => {
                    const viewId = tab.dataset.view;
                    if (viewId === 'view-profile') renderProfile();
                    if (viewId === 'view-home') {
                        renderPrograms();
                        renderActivityRing();
                    }
                    navigateTo(viewId);
                });
            });
            
            // Telegram Back Button
            if (tg) {
                tg.BackButton.onClick(() => {
                    const current = state.currentView;
                    if (current === 'view-exercise-detail') {
                        navigateTo('view-exercises', 'back');
                    } else if (current === 'view-exercises' || current === 'view-rest') {
                        navigateTo('view-home', 'back');
                    } else if (current === 'view-builder') {
                        navigateTo('view-home', 'back');
                    } else if (current === 'view-completion') {
                        navigateTo('view-home', 'back');
                    } else {
                        navigateTo('view-home', 'back');
                    }
                });
            }
            
            // Настройки отдыха (ползунок)
            const slider = document.getElementById('rest-time-slider');
            if (slider) {
                slider.addEventListener('input', (e) => {
                    document.getElementById('rest-time-display').textContent = e.target.value;
                });
            }
            
            document.getElementById('save-rest-settings-btn')?.addEventListener('click', () => {
                state.restTime = parseInt(document.getElementById('rest-time-slider').value);
                saveState();
                closeModal('modal-rest-settings');
                hapticFeedback('success');
            });
            
            // Поделиться
            document.getElementById('share-workout-btn')?.addEventListener('click', () => {
                const text = `🔥 Я только что завершил тренировку в gym***! Присоединяйся!`;
                if (tg) {
                    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(text)}`);
                }
            });
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
        // ============================================
        function init() {
            loadState();
            setupEventListeners();
            
            // Проверяем, прошел ли пользователь онбординг
            if (state.user.age && state.user.height && state.user.weight) {
                navigateTo('view-home');
                renderPrograms();
                renderActivityRing();
            } else {
                navigateTo('view-onboarding');
            }
        }

        // Запуск приложения
        init();
    </script>
</body>
</html>
